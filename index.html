<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b9d9f5"><meta name="apple-mobile-web-app-capable" content="yes"><title>💎 轉帳鑽石點數換算器</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#26334e;background:radial-gradient(circle at 20% 15%,#fff 0,transparent 40%),linear-gradient(145deg,#d9eaff,#f7e6f7 55%,#c6e9f4);padding:20px}.card{width:min(100%,440px);padding:28px 22px;border:1px solid #ffffffb8;border-radius:28px;background:#ffffff70;box-shadow:0 18px 55px #6078a533;backdrop-filter:blur(22px)}h1{font-size:23px;text-align:center;margin:0 0 7px}.sub{text-align:center;color:#68778c;font-size:13px;margin:0 0 30px}.top{display:flex;align-items:center;justify-content:space-between;font-weight:700;margin-bottom:12px}.limit{font-size:12px;color:#738096;font-weight:400}.entry{display:flex;align-items:center;gap:12px}.entry input{width:100%;min-width:0;padding:13px;border-radius:15px;border:1px solid #fff;background:#ffffffb8;color:#253654;font-size:30px;font-weight:700;text-align:center;outline-color:#779de6}.unit{font-weight:700}input[type=range]{width:100%;accent-color:#779ce9;margin:23px 0 3px}.ends{display:flex;justify-content:space-between;color:#75849a;font-size:12px}.results{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:25px 0 18px}.result{background:#ffffff9c;border:1px solid #fff;border-radius:18px;padding:17px 12px;min-width:0}.label{font-size:12px;color:#697b96}.number{font-size:clamp(20px,5vw,27px);font-weight:800;margin:9px 0 3px;overflow-wrap:anywhere}.suffix{font-size:12px;color:#76859b}button{width:100%;border:0;border-radius:15px;background:#6f94dd;color:#fff;font-size:16px;font-weight:700;padding:15px;cursor:pointer}button:active{transform:scale(.99)}#status{text-align:center;font-size:12px;min-height:18px;margin-top:12px;color:#506a92}</style></head><body><main class="card"><h1>💎 轉帳鑽石點數換算器</h1><p class="sub">0～100 點・即時自動換算</p><div class="top"><label for="points">轉帳點數</label><span class="limit">最多 100 點</span></div><div class="entry"><input id="points" type="number" inputmode="numeric" min="0" max="100" step="1" value="10"><span class="unit">點</span></div><input id="slider" type="range" min="0" max="100" step="1" value="10" aria-label="調整轉帳點數"><div class="ends"><span>0 點</span><span>100 點</span></div><div class="results"><div class="result"><div class="label">💎 鑽石數量</div><div class="number" id="diamonds">50,000</div><div class="suffix">顆鑽石</div></div><div class="result"><div class="label">新台幣金額</div><div class="number" id="twd">$300</div><div class="suffix">TWD</div></div></div><button id="copy" type="button">⧉ 複製換算結果</button><div id="status" role="status" aria-live="polite"></div></main><script>const input=document.getElementById('points'),slider=document.getElementById('slider'),diamonds=document.getElementById('diamonds'),twd=document.getElementById('twd'),status=document.getElementById('status');let value=10;const fmt=n=>n.toLocaleString('zh-TW');function update(raw){const n=Number(raw);value=Math.min(100,Math.max(0,Number.isFinite(n)?Math.trunc(n):0));input.value=value;slider.value=value;diamonds.textContent=fmt(value*5000);twd.textContent='$'+fmt(value*30);status.textContent=''}input.addEventListener('input',()=>update(input.value));slider.addEventListener('input',()=>update(slider.value));document.getElementById('copy').addEventListener('click',async()=>{const txt=`轉帳點數：${value} 點\n💎 鑽石數量：${fmt(value*5000)} 顆\n新台幣：$${fmt(value*30)} 元`;try{await navigator.clipboard.writeText(txt);status.textContent='已複製換算結果'}catch(e){const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();status.textContent=ok?'已複製換算結果':'無法自動複製，請使用 HTTPS 網頁開啟'}});</script></body></html>
